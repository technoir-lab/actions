name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  merge_group:
    types: [ checks_requested ]

concurrency:
  group: ${{ github.workflow_ref }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    name: Checks (${{ matrix.os }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-26.04
          - macos-26
          - windows-2025

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up KMP
        id: setup-kmp
        uses: ./setup-kotlin-multiplatform

      - name: Check restored toolchains
        shell: bash
        env:
          CACHE_HIT: ${{ steps.setup-kmp.outputs.cache-hit }}
        run: |
          echo "Cache hit: ${CACHE_HIT:-false}"
          if [ "$CACHE_HIT" = "true" ]; then
            test -f ~/.konan/marker
          fi

      - name: Create toolchain marker
        shell: bash
        run: |
          mkdir -p ~/.konan
          echo "$GITHUB_SHA" > ~/.konan/marker

      - name: Set up GCP Gradle build cache
        id: setup-build-cache
        uses: ./setup-gcp-gradle-build-cache

      - name: Check build cache credentials
        shell: bash
        env:
          ENABLED: ${{ steps.setup-build-cache.outputs.enabled }}
        run: |
          echo "Build cache enabled: $ENABLED"
          if [ "$ENABLED" = "true" ]; then
            test -s "$GCP_BUILD_CACHE_CREDENTIALS"
            [[ "$GCP_BUILD_CACHE_CREDENTIALS" == "$RUNNER_TEMP"/* ]]
            test "$GCP_BUILD_CACHE_PUSH" = "true"
          else
            test -z "${GCP_BUILD_CACHE_CREDENTIALS:-}"
            test -z "${GCP_BUILD_CACHE_PUSH:-}"
          fi
          test -z "$(find . -maxdepth 1 -name 'gha-creds-*.json')"

  actionlint:
    name: Lint GitHub Actions
    runs-on: ubuntu-26.04

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Run actionlint
        uses: reviewdog/action-actionlint@v1.79.1
        with:
          level: warning
          fail_level: error
